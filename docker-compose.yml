services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: voyage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voyage
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: voyage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

